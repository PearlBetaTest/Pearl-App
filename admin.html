<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pearl - Admin Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Work+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --paper: #F6EEDE;
            --paper-2: #EFE3CB;
            --card: #FBF5E8;
            --ink: #221D14;
            --ink-soft: #5B5340;
            --rust: #B7401E;
            --rust-dark: #8E3016;
            --leaf: #2E6B41;
            --leaf-dark: #1F4C2E;
            --gold: #D69A2D;
            --line: rgba(34, 29, 20, 0.18);
            --line-strong: rgba(34, 29, 20, 0.32);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Work Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            line-height: 1.6;
            color: var(--ink);
            background: var(--paper);
            min-height: 100vh;
            position: relative;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            opacity: 0.5;
            background-image: radial-gradient(rgba(34, 29, 20, 0.06) 1px, transparent 1px);
            background-size: 4px 4px;
        }

        h1, h2, h3 {
            font-family: 'Fraunces', serif;
            font-weight: 500;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 20px;
            position: relative;
            z-index: 1;
        }

        .header {
            text-align: center;
            color: var(--ink);
            margin-bottom: 40px;
        }

        .header-title {
            font-family: 'Times New Roman', Times, serif;
            font-size: 2.5em;
            margin: 0;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: var(--ink);
        }

        .header-subtitle {
            font-family: 'Space Mono', monospace;
            font-size: 12px;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: var(--rust-dark);
        }

        .card {
            position: relative;
            background: #FFFDF6;
            border-radius: 3px;
            padding: 30px;
            box-shadow: 8px 10px 0 rgba(34, 29, 20, 0.12);
            border: 1px solid var(--line-strong);
            margin-bottom: 30px;
        }

        .card h2, .card h3 {
            color: var(--ink);
            font-weight: 500;
            letter-spacing: -0.01em;
        }

        .login-card {
            max-width: 400px;
            margin: 5rem auto;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #555;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e1e5e9;
            border-radius: 8px;
            font-size: 16px;
            font-family: 'Work Sans', sans-serif;
            transition: border-color 0.3s ease;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #2196f3;
            box-shadow: 0 0 0 3px rgba(33, 150, 243, 0.1);
        }

        .btn {
            background: var(--rust);
            color: var(--paper);
            border: 1px solid var(--rust-dark);
            padding: 15px 30px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            font-family: 'Work Sans', sans-serif;
            letter-spacing: 0.01em;
            transition: background 0.15s ease, transform 0.1s ease;
        }

        .btn:hover {
            background: var(--rust-dark);
        }

        .btn:active {
            transform: scale(0.99);
        }

        .btn-full {
            width: 100%;
        }

        .btn-secondary {
            background: var(--ink-soft);
            border-color: var(--ink);
        }

        .btn-secondary:hover {
            background: var(--ink);
        }

        .btn-danger {
            background: #a13a2e;
            border-color: #7a2c22;
        }

        .btn-danger:hover {
            background: #7a2c22;
        }

        .hidden {
            display: none !important;
        }

        .success {
            background: #d4edda;
            color: #155724;
            padding: 15px;
            border-radius: 3px;
            margin-bottom: 20px;
            border: 1px solid #c3e6cb;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 3px;
            margin-bottom: 20px;
            border: 1px solid #f5c6cb;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: #FFFDF6;
            border: 2px solid var(--line-strong);
            padding: 22px 20px;
            border-radius: 3px;
            text-align: center;
        }

        .stat-card.stat-total {
            background: rgba(183, 64, 30, 0.1);
            border-color: var(--rust);
        }

        .stat-card.stat-pending {
            background: #fff3cd;
            border-color: #c99a1f;
        }

        .stat-card.stat-progress {
            background: #d1ecf1;
            border-color: #4c92a3;
        }

        .stat-card.stat-completed {
            background: #d4edda;
            border-color: #3f8a56;
        }

        .stat-number {
            font-family: 'Fraunces', serif;
            font-size: 2.4em;
            font-weight: 600;
            color: #000;
        }

        .stat-total .stat-number,
        .stat-pending .stat-number,
        .stat-progress .stat-number,
        .stat-completed .stat-number {
            color: #000;
        }

        .stat-label {
            font-family: 'Space Mono', monospace;
            font-size: 11px;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            color: var(--ink-soft);
            margin-top: 5px;
        }

        /* Filter section */
        .filters {
            background: #FFFDF6;
            border: 1px solid var(--line-strong);
            padding: 20px;
            border-radius: 3px;
            margin-bottom: 30px;
            box-shadow: 8px 10px 0 rgba(34, 29, 20, 0.08);
        }

        .filter-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            align-items: end;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
        }

        .filter-group label {
            font-weight: 600;
            margin-bottom: 8px;
            color: #555;
            font-size: 14px;
        }

        .filter-group select {
            padding: 10px;
            border: 2px solid #e1e5e9;
            border-radius: 8px;
            font-size: 14px;
            font-family: 'Work Sans', sans-serif;
            transition: border-color 0.3s ease;
        }

        .filter-group select:focus {
            outline: none;
            border-color: #2196f3;
            box-shadow: 0 0 0 3px rgba(33, 150, 243, 0.1);
        }

        .clear-filters {
            background: var(--gold);
            color: var(--ink);
            border: 1px solid var(--rust-dark);
            padding: 10px 20px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            font-family: 'Work Sans', sans-serif;
            transition: all 0.3s ease;
            height: fit-content;
        }

        .clear-filters:hover {
            background: #c98a1f;
        }

        .request-item {
            background: var(--paper-2);
            border: 1px solid var(--line-strong);
            border-radius: 3px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .request-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .request-id {
            font-family: 'Space Mono', monospace;
            font-weight: 700;
            color: var(--rust-dark);
            font-size: 1em;
        }

        .status-badge {
            padding: 6px 15px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .status-pending {
            background: #fff3cd;
            color: #856404;
        }

        .status-in-progress {
            background: #d1ecf1;
            color: #0c5460;
        }

        .status-completed {
            background: #d4edda;
            color: #155724;
        }

        .status-cancelled {
            background: #e2e3e5;
            color: #41464b;
        }

        .request-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 15px;
        }

        .detail-item {
            background: #FFFDF6;
            border: 1px solid var(--line-strong);
            padding: 12px;
            border-radius: 3px;
            border-left: 4px solid var(--rust);
            box-shadow: 2px 3px 0 rgba(34, 29, 20, 0.06);
        }

        .detail-label {
            font-family: 'Space Mono', monospace;
            font-size: 11px;
            color: var(--ink-soft);
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .detail-value {
            font-weight: 600;
            color: var(--ink);
            word-break: break-word;
        }

        .description-box {
            margin: 15px 0;
            padding: 15px;
            background: #FFFDF6;
            border: 1px solid var(--line-strong);
            border-radius: 3px;
            border-left: 4px solid var(--leaf);
            box-shadow: 2px 3px 0 rgba(34, 29, 20, 0.06);
        }

        .actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 15px;
        }

        .actions select {
            flex: 1;
            min-width: 150px;
            padding: 10px;
            border: 2px solid #e1e5e9;
            border-radius: 8px;
            font-size: 14px;
            font-family: 'Work Sans', sans-serif;
            transition: border-color 0.3s ease;
        }

        .actions select:focus {
            outline: none;
            border-color: #2196f3;
            box-shadow: 0 0 0 3px rgba(33, 150, 243, 0.1);
        }

        .whatsapp-link {
            background: #25d366;
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 5px;
            font-size: 14px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            transition: all 0.3s ease;
        }

        .whatsapp-link:hover {
            background: #128c7e;
        }

        .team-input-row {
            display: flex;
            gap: 10px;
            margin: 15px 0;
            flex-wrap: wrap;
        }

        .team-input-row input {
            flex: 1;
            min-width: 200px;
        }

        .team-list {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 15px;
        }

        .team-member {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--card);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            color: var(--rust-dark);
            border: 1px solid var(--line-strong);
        }

        .remove-member {
            background: var(--rust);
            color: white;
            border: none;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            font-size: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .remove-member:hover {
            background: var(--rust-dark);
            transform: scale(1.1);
        }

        .loading {
            text-align: center;
            padding: 2rem;
            color: var(--ink-soft);
            font-style: italic;
        }

        .empty-state {
            text-align: center;
            padding: 3rem;
            color: var(--ink-soft);
        }

        .empty-state h3 {
            color: var(--ink);
            margin-bottom: 1rem;
        }

        .results-info {
            font-family: 'Space Mono', monospace;
            color: var(--ink-soft);
            font-size: 12px;
            margin-bottom: 20px;
        }

        /* Navigation styles */
        .main-nav {
            position: sticky;
            top: 0;
            z-index: 50;
            background: #FFFDF6;
            border-bottom: 1px solid var(--line-strong);
            box-shadow: 0 2px 10px rgba(34, 29, 20, 0.06);
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
        }

        .nav-wordmark {
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: 'Fraunces', serif;
            font-weight: 600;
            font-size: 20px;
            letter-spacing: -0.01em;
            color: var(--ink);
        }

        .nav-wordmark img {
            width: 20px;
            height: auto;
            border-radius: 2px;
        }

        .nav-wordmark .dot {
            color: var(--rust);
        }

        .nav-buttons {
            display: inline-flex;
            gap: 20px;
            align-items: center;
            flex-wrap: wrap;
        }

        .nav-btn {
            background: transparent;
            color: var(--ink-soft);
            border: none;
            border-bottom: 1px solid transparent;
            padding: 4px 0;
            cursor: pointer;
            font-family: 'Work Sans', sans-serif;
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 0.01em;
            transition: color 0.15s ease, border-color 0.15s ease;
            white-space: nowrap;
        }

        .nav-btn:hover {
            color: var(--ink);
            border-color: var(--line-strong);
        }

        .nav-btn.active {
            color: var(--ink);
            font-weight: 600;
            border-color: var(--rust);
        }

        .tab-content {
            display: block;
        }

        .tab-content.hidden {
            display: none;
        }

        /* Pagination */
        .pagination-container {
            margin-top: 20px;
            text-align: center;
        }

        .pagination {
            display: inline-flex;
            align-items: center;
            gap: 15px;
            background: #FFFDF6;
            border: 1px solid var(--line-strong);
            padding: 15px 25px;
            border-radius: 3px;
        }

        .pagination-btn {
            background: var(--rust);
            color: white;
            border: 1px solid var(--rust-dark);
            padding: 10px 20px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            font-family: 'Work Sans', sans-serif;
            transition: all 0.3s ease;
        }

        .pagination-btn:hover:not(:disabled) {
            background: var(--rust-dark);
        }

        .pagination-btn:disabled {
            background: #ccc;
            border-color: #bbb;
            cursor: not-allowed;
        }

        .pagination-info {
            font-family: 'Space Mono', monospace;
            font-size: 13px;
            color: var(--ink-soft);
            min-width: 120px;
        }

        @media (max-width: 768px) {
            .container {
                padding: 10px;
            }

            .header-title {
                font-size: 2em;
            }

            .card {
                padding: 20px;
            }

            .request-details {
                grid-template-columns: 1fr;
            }

            .actions {
                flex-direction: column;
            }

            .actions select,
            .whatsapp-link {
                width: 100%;
                justify-content: center;
            }

            .team-input-row {
                flex-direction: column;
            }

            .team-input-row input {
                width: 100%;
                min-width: unset;
            }

            .stats {
                grid-template-columns: repeat(2, 1fr);
                gap: 15px;
            }

            .stat-card {
                padding: 15px;
            }

            .stat-number {
                font-size: 1.8em;
            }

            .filter-row {
                grid-template-columns: 1fr;
                gap: 15px;
            }
        }
    </style>
</head>

<body>
    <!-- Login Screen -->
    <div id="login-screen">
        <div class="container">
            <div class="header">
                <div style="display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 10px;">
                    <h1 class="header-title">Pearl<span style="color: var(--rust);">.</span></h1>
                    <img src="images/Flag_map_of_Kenya.png" alt="Kenya" style="width: 24px; height: auto;" />
                </div>
                <p class="header-subtitle">Admin Dashboard</p>
            </div>

            <div class="card login-card">
                <h2 style="text-align: center; margin-bottom: 2rem;">Admin Access</h2>

                <div class="form-group">
                    <label for="admin-email">Email</label>
                    <input type="email" id="admin-email" placeholder="Enter admin email" required>
                </div>

                <div class="form-group">
                    <label for="admin-password">Password</label>
                    <input type="password" id="admin-password" placeholder="Enter admin password" required>
                </div>

                <button onclick="signInAdmin()" class="btn btn-full">Login</button>
                <div id="login-error" class="error hidden">Please check your credentials and try again.</div>
            </div>
        </div>
    </div>

    <!-- Admin Dashboard -->
    <div id="admin-dashboard" class="hidden">
        <!-- Navigation -->
        <div class="main-nav hidden" id="main-nav">
            <div class="nav-wordmark">Pearl<span class="dot">.</span><img src="images/Flag_map_of_Kenya.png" alt="Kenya"></div>
            <div class="nav-buttons">
                <button class="nav-btn active" onclick="switchTab('requests')">Requests</button>
                <button class="nav-btn" onclick="switchTab('team')">Team Management</button>
            </div>
        </div>

        <div class="container">
            <div class="header">
                <p class="header-subtitle">Admin Dashboard — Request Management</p>
            </div>

            <!-- Stats Cards -->
            <div class="stats">
                <div class="stat-card stat-total">
                    <div class="stat-number" id="total-requests">-</div>
                    <div class="stat-label">Total Requests</div>
                </div>
                <div class="stat-card stat-pending">
                    <div class="stat-number" id="pending-requests">-</div>
                    <div class="stat-label">Pending</div>
                </div>
                <div class="stat-card stat-progress">
                    <div class="stat-number" id="active-requests">-</div>
                    <div class="stat-label">In Progress</div>
                </div>
                <div class="stat-card stat-completed">
                    <div class="stat-number" id="completed-requests">-</div>
                    <div class="stat-label">Completed</div>
                </div>
            </div>

            <!-- Requests Tab -->
            <div id="requests-tab" class="tab-content active">
                <!-- Filters -->
                <div class="filters">
                    <h3 style="margin-bottom: 15px;">Filter Requests</h3>
                    <div class="filter-row">
                        <div class="filter-group">
                            <label for="status-filter">Filter by Status</label>
                            <select id="status-filter" onchange="applyFilters()">
                                <option value="">All Statuses</option>
                                <option value="pending">Pending</option>
                                <option value="in-progress">In Progress</option>
                                <option value="completed">Completed</option>
                                <option value="cancelled">Cancelled</option>
                            </select>
                        </div>
                        <div class="filter-group">
                            <label for="employee-filter">Filter by Employee</label>
                            <select id="employee-filter" onchange="applyFilters()">
                                <option value="">All Employees</option>
                            </select>
                        </div>
                        <div class="filter-group">
                            <button onclick="clearFilters()" class="clear-filters">Clear Filters</button>
                        </div>
                    </div>
                </div>

                <!-- Requests Section -->
                <div class="card">
                    <h3 style="margin-bottom: 20px;">All Requests</h3>
                    <div id="results-info" class="results-info"></div>
                    <div id="requests-container">
                        <div class="loading">Loading requests...</div>
                    </div>
                </div>
            </div>

            <!-- Team Management Tab -->
            <div id="team-tab" class="tab-content hidden">
                <div class="card">
                    <h3 style="margin-bottom: 15px;">Team Management</h3>
                    <div class="team-input-row">
                        <input type="text" id="new-member" placeholder="Enter team member name">
                        <button onclick="addTeamMember()" class="btn">Add Member</button>
                    </div>
                    <div id="team-list" class="team-list">
                        <div class="loading">Loading team members...</div>
                    </div>
                </div>
            </div>

        </div>
    </div>


    <!-- Firebase Scripts -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="config.js"></script>
    <script>

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        // Global state
        let isAdminAuthenticated = false;
        let allRequests = [];
        let filteredRequests = [];
        let teamMembers = [];
        let currentFilters = {
            status: 'pending', // Default to pending
            employee: ''
        };

        // Pagination state
        let currentPage = 1;
        const itemsPerPage = 10;
        let currentTab = 'requests';

        // Tab switching function
        function switchTab(tabName) {
            // Update nav buttons
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            document.querySelector(`[onclick="switchTab('${tabName}')"]`).classList.add('active');

            // Update tab content
            document.querySelectorAll('.tab-content').forEach(content => {
                content.classList.add('hidden');
            });
            document.getElementById(`${tabName}-tab`).classList.remove('hidden');

            currentTab = tabName;
        }

        // Get status group for filtering — maps both the current statuses
        // and any legacy granular statuses onto pending / in-progress / completed / cancelled
        function getStatusGroup(status) {
            if (!status || status === 'new' || status === 'pending') return 'pending';
            if (status === 'delivered' || status === 'completed') return 'completed';
            if (status === 'cancelled') return 'cancelled';
            return 'in-progress'; // in-progress, assigned, sourcing, options-found, paid
        }

        function getStatusLabel(group) {
            const labels = {
                'pending': 'Pending',
                'in-progress': 'In Progress',
                'completed': 'Completed',
                'cancelled': 'Cancelled'
            };
            return labels[group] || group;
        }

        // Authentication state observer
        auth.onAuthStateChanged(async (user) => {
            if (user) {
                try {
                    // Get the user's ID token and check for admin claim
                    const idTokenResult = await user.getIdTokenResult();

                    // For testing - remove admin check temporarily
                    // if (idTokenResult.claims.admin === true) {
                    if (user) { // Just check if user is authenticated
                        isAdminAuthenticated = true;
                        showAdminDashboard();
                        initializeDashboard();
                    } else {
                        showError('Access denied: Admin privileges required');
                        signOut();
                    }
                } catch (error) {
                    console.error('Error checking admin claims:', error);
                    showError('Authentication error. Please try again.');
                    signOut();
                }
            } else {
                // User is not authenticated
                isAdminAuthenticated = false;
                showLoginScreen();
            }
        });

        // Show login screen
        function showLoginScreen() {
            document.getElementById('login-screen').classList.remove('hidden');
            document.getElementById('admin-dashboard').classList.add('hidden');
            document.getElementById('main-nav').classList.add('hidden');
        }

        // Show admin dashboard
        function showAdminDashboard() {
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('admin-dashboard').classList.remove('hidden');
            document.getElementById('main-nav').classList.remove('hidden');
            document.getElementById('login-error').classList.add('hidden');
        }

        // Sign in with email and password
        async function signInAdmin() {
            const email = document.getElementById('admin-email').value.trim();
            const password = document.getElementById('admin-password').value;

            if (!email || !password) {
                showLoginError('Please enter both email and password');
                return;
            }

            try {
                await auth.signInWithEmailAndPassword(email, password);
                // Auth state change will handle the rest
            } catch (error) {
                console.error('Sign in error:', error);
                let errorMessage = 'Login failed. Please check your credentials.';

                switch (error.code) {
                    case 'auth/user-not-found':
                    case 'auth/wrong-password':
                    case 'auth/invalid-email':
                        errorMessage = 'Invalid email or password';
                        break;
                    case 'auth/too-many-requests':
                        errorMessage = 'Too many failed attempts. Please try again later.';
                        break;
                }

                showLoginError(errorMessage);
            }
        }

        // Sign out
        async function signOut() {
            try {
                await auth.signOut();
                showLoginScreen();
            } catch (error) {
                console.error('Sign out error:', error);
            }
        }

        // Show login error
        function showLoginError(message) {
            const errorElement = document.getElementById('login-error');
            errorElement.textContent = message;
            errorElement.classList.remove('hidden');
            setTimeout(() => {
                errorElement.classList.add('hidden');
            }, 5000);
        }

        // Enter key support for login
        document.addEventListener('DOMContentLoaded', function () {
            const emailField = document.getElementById('admin-email');
            const passwordField = document.getElementById('admin-password');

            if (emailField && passwordField) {
                emailField.addEventListener('keypress', function (e) {
                    if (e.key === 'Enter') {
                        passwordField.focus();
                    }
                });

                passwordField.addEventListener('keypress', function (e) {
                    if (e.key === 'Enter') {
                        signInAdmin();
                    }
                });
            }

            // Add team member enter key support
            const newMemberField = document.getElementById('new-member');
            if (newMemberField) {
                newMemberField.addEventListener('keypress', function (e) {
                    if (e.key === 'Enter') {
                        addTeamMember();
                    }
                });
            }

        });

        // Load requests from Firestore
        function loadRequests() {
            return new Promise((resolve, reject) => {
                if (!isAdminAuthenticated) {
                    reject(new Error('Not authenticated'));
                    return;
                }

                db.collection('requests')
                    .orderBy('timestamp', 'desc')
                    .onSnapshot((snapshot) => {
                        allRequests = [];
                        snapshot.forEach((doc) => {
                            const data = doc.data();
                            allRequests.push({
                                id: doc.id,
                                ...data,
                                timestamp: data.timestamp?.toDate() || new Date()
                            });
                        });
                        applyFilters();
                        updateStats();
                        resolve();
                    }, (error) => {
                        console.error('Error loading requests:', error);
                        showError('Failed to load requests: ' + error.message);
                        reject(error);
                    });
            });
        }

        // Load team members from Firestore
        function loadTeamMembers() {
            return new Promise((resolve, reject) => {
                if (!isAdminAuthenticated) {
                    reject(new Error('Not authenticated'));
                    return;
                }

                db.collection('teamMembers')
                    .onSnapshot((snapshot) => {
                        teamMembers = ['You']; // Default member
                        snapshot.forEach((doc) => {
                            const data = doc.data();
                            if (data.name && !teamMembers.includes(data.name)) {
                                teamMembers.push(data.name);
                            }
                        });
                        updateTeamDisplay();
                        updateEmployeeFilter();
                        resolve();
                    }, (error) => {
                        console.error('Error loading team members:', error);
                        showError('Failed to load team members: ' + error.message);
                        reject(error);
                    });
            });
        }

        // Initialize dashboard data
        async function initializeDashboard() {
            if (!isAdminAuthenticated) return;

            try {
                await Promise.all([
                    loadRequests(),
                    loadTeamMembers()
                ]);

                // Set default status filter to pending after loading
                const statusFilter = document.getElementById('status-filter');
                if (statusFilter) {
                    statusFilter.value = 'pending';
                }

                applyFilters(); // Apply default filters
            } catch (error) {
                console.error('Error initializing dashboard:', error);
                showError('Failed to load dashboard data: ' + error.message);
            }
        }

        // Update employee filter dropdown
        function updateEmployeeFilter() {
            const employeeFilter = document.getElementById('employee-filter');
            if (!employeeFilter) return;

            const currentValue = employeeFilter.value;

            employeeFilter.innerHTML = '<option value="">All Employees</option>';

            // Add team members
            teamMembers.forEach(member => {
                const option = document.createElement('option');
                option.value = member;
                option.textContent = member;
                employeeFilter.appendChild(option);
            });

            // Add "Unassigned" option
            const unassignedOption = document.createElement('option');
            unassignedOption.value = 'Unassigned';
            unassignedOption.textContent = 'Unassigned';
            employeeFilter.appendChild(unassignedOption);

            // Restore previous selection if it still exists
            if (currentValue) {
                employeeFilter.value = currentValue;
            }
        }

        // Apply filters — with pagination
        function applyFilters() {
            const statusFilter = document.getElementById('status-filter');
            const employeeFilter = document.getElementById('employee-filter');

            if (!statusFilter || !employeeFilter) return;

            currentFilters = {
                status: statusFilter.value,
                employee: employeeFilter.value
            };

            filteredRequests = allRequests.filter(request => {
                // Status filter (using grouped statuses)
                if (currentFilters.status) {
                    const requestStatusGroup = getStatusGroup(request.status);
                    if (requestStatusGroup !== currentFilters.status) {
                        return false;
                    }
                }

                // Employee filter
                if (currentFilters.employee) {
                    if (currentFilters.employee === 'Unassigned' && request.assignedTo) {
                        return false;
                    } else if (currentFilters.employee !== 'Unassigned' && request.assignedTo !== currentFilters.employee) {
                        return false;
                    }
                }

                return true;
            });

            // Reset to first page when filters change
            currentPage = 1;
            updateRequestsDisplay();
            updateResultsInfo();
            updatePaginationControls();
        }

        // Clear all filters
        function clearFilters() {
            const statusFilter = document.getElementById('status-filter');
            const employeeFilter = document.getElementById('employee-filter');

            if (statusFilter) statusFilter.value = 'pending'; // Reset to pending instead of empty
            if (employeeFilter) employeeFilter.value = '';

            currentFilters = {
                status: 'pending',
                employee: ''
            };
            currentPage = 1;
            applyFilters();
        }

        // Update results info — with pagination
        function updateResultsInfo() {
            const resultsInfo = document.getElementById('results-info');
            if (!resultsInfo) return;

            const totalFiltered = filteredRequests.length;
            const startIndex = (currentPage - 1) * itemsPerPage + 1;
            const endIndex = Math.min(currentPage * itemsPerPage, totalFiltered);

            let infoText = '';

            if (currentFilters.status || currentFilters.employee) {
                const activeFilters = [];
                if (currentFilters.status) {
                    activeFilters.push(`Status: ${getStatusLabel(currentFilters.status)}`);
                }
                if (currentFilters.employee) {
                    activeFilters.push(`Employee: ${currentFilters.employee}`);
                }

                infoText = `Showing ${startIndex}-${endIndex} of ${totalFiltered} requests (Total: ${allRequests.length}, Filtered by: ${activeFilters.join(', ')})`;
            } else {
                infoText = `Showing ${startIndex}-${endIndex} of ${totalFiltered} requests`;
            }

            resultsInfo.textContent = infoText;
        }

        // Update statistics — grouped into pending / in-progress / completed
        function updateStats() {
            const totalRequests = allRequests.length;
            const pendingRequests = allRequests.filter(r => getStatusGroup(r.status) === 'pending').length;
            const inProgressRequests = allRequests.filter(r => getStatusGroup(r.status) === 'in-progress').length;
            const completedRequests = allRequests.filter(r => getStatusGroup(r.status) === 'completed').length;

            const totalEl = document.getElementById('total-requests');
            const pendingEl = document.getElementById('pending-requests');
            const activeEl = document.getElementById('active-requests');
            const completedEl = document.getElementById('completed-requests');

            if (totalEl) totalEl.textContent = totalRequests;
            if (pendingEl) pendingEl.textContent = pendingRequests;
            if (activeEl) activeEl.textContent = inProgressRequests;
            if (completedEl) completedEl.textContent = completedRequests;
        }

        // Close delivery modal
        function closeDeliveryModal(event) {
            if (event && event.target !== event.currentTarget) return;
            const modal = document.getElementById('delivery-modal');
            if (modal) {
                modal.remove();
            }
        }

        // Complete delivery with price and notes — sets status to 'completed'
        async function completeDelivery(requestId) {
            if (!isAdminAuthenticated) {
                showError('Authentication required');
                return;
            }

            const itemPrice = document.getElementById('item-price').value.trim();
            const serviceFee = document.getElementById('service-fee').value.trim();
            const deliveryNotes = document.getElementById('delivery-notes').value.trim();

            const updateData = {
                status: 'completed',
                updatedAt: firebase.firestore.FieldValue.serverTimestamp()
            };

            // Add item price if provided
            if (itemPrice) {
                updateData.itemPrice = parseFloat(itemPrice);
            }

            // Add service fee if provided
            if (serviceFee) {
                updateData.serviceFee = parseFloat(serviceFee);
            }

            // Add delivery notes if provided
            if (deliveryNotes) {
                updateData.deliveryNotes = deliveryNotes;
            }

            try {
                await db.collection('requests').doc(requestId).update(updateData);
                closeDeliveryModal();
                showSuccess('Request marked as completed successfully!');
            } catch (error) {
                console.error('Error updating to completed:', error);
                showError('Failed to mark as completed: ' + error.message);
            }
        }

        // Pagination functions
        function updatePaginationControls() {
            const totalPages = Math.ceil(filteredRequests.length / itemsPerPage);

            // Create pagination HTML
            let paginationHTML = '';
            if (totalPages > 1) {
                paginationHTML = `
            <div class="pagination">
                <button onclick="goToPage(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''} class="pagination-btn">
                    Previous
                </button>
                <span class="pagination-info">Page ${currentPage} of ${totalPages}</span>
                <button onclick="goToPage(${currentPage + 1})" ${currentPage === totalPages ? 'disabled' : ''} class="pagination-btn">
                    Next
                </button>
            </div>
        `;
            }

            // Insert pagination after requests container
            const container = document.getElementById('requests-container');
            if (container && container.parentNode) {
                let paginationDiv = container.parentNode.querySelector('.pagination-container');
                if (!paginationDiv) {
                    paginationDiv = document.createElement('div');
                    paginationDiv.className = 'pagination-container';
                    container.parentNode.insertBefore(paginationDiv, container.nextSibling);
                }
                paginationDiv.innerHTML = paginationHTML;
            }
        }

        function goToPage(page) {
            const totalPages = Math.ceil(filteredRequests.length / itemsPerPage);
            if (page < 1 || page > totalPages) return;

            currentPage = page;
            updateRequestsDisplay();
            updateResultsInfo();
            updatePaginationControls();
        }

        // Update team members display
        function updateTeamDisplay() {
            const container = document.getElementById('team-list');
            if (!container) return;

            container.innerHTML = teamMembers.map((member, index) => `
        <div class="team-member">
            <span>${member}</span>
            ${member !== 'You' ? `<button class="remove-member" onclick="removeTeamMember('${member}')" title="Remove ${member}">×</button>` : ''}

            updateRequestsDisplay();

        // Add team member
        async function addTeamMember() {
            if (!isAdminAuthenticated) {
                showError('Authentication required');
                return;
            }

            const memberName = document.getElementById('new-member').value.trim();
            if (!memberName) {
                showError('Please enter a team member name');
                return;
            }

            if (teamMembers.includes(memberName)) {
                showError('Team member already exists');
                return;
            }

            try {
                await db.collection('teamMembers').add({
                    name: memberName,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });

                document.getElementById('new-member').value = '';
                showSuccess(`${memberName} has been added to the team`);
            } catch (error) {
                console.error('Error adding team member:', error);
                showError('Failed to add team member: ' + error.message);
            }
        }

        // Remove team member
        async function removeTeamMember(memberName) {
            if (!isAdminAuthenticated) {
                showError('Authentication required');
                return;
            }

            if (!confirm(`Remove ${memberName} from the team?`)) return;

            try {
                const snapshot = await db.collection('teamMembers')
                    .where('name', '==', memberName)
                    .get();

                const batch = db.batch();
                snapshot.forEach((doc) => {
                    batch.delete(doc.ref);
                });

                await batch.commit();
                showSuccess(`${memberName} has been removed from the team`);
            } catch (error) {
                console.error('Error removing team member:', error);
                showError('Failed to remove team member: ' + error.message);
            }
        }

        // Assign request to team member — assigning moves the status to In Progress
        async function assignRequest(requestId, memberName) {
            if (!isAdminAuthenticated) {
                showError('Authentication required');
                return;
            }

            if (!memberName) return;

            try {
                await db.collection('requests').doc(requestId).update({
                    assignedTo: memberName,
                    status: 'in-progress',
                    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                });

                showSuccess(`Request assigned to ${memberName} and status updated to In Progress`);
            } catch (error) {
                console.error('Error assigning request:', error);
                showError('Failed to assign request: ' + error.message);
            }
        }

        // Status update handler — 'completed' opens the same form used for delivery
        function updateStatusHandler(requestId, newStatus) {
            if (newStatus === 'completed') {
                showDeliveryModal(requestId);
                // Reset the dropdown to its previous value until the form is submitted
                const selectElement = event.target;
                const currentRequest = filteredRequests.find(r => r.id === requestId);
                selectElement.value = currentRequest ? getStatusGroup(currentRequest.status) : 'pending';
            } else {
                updateStatus(requestId, newStatus);
            }
        }

        // Update request status
        async function updateStatus(requestId, newStatus) {
            if (!isAdminAuthenticated) {
                showError('Authentication required');
                return;
            }

            if (!newStatus) return;

            try {
                await db.collection('requests').doc(requestId).update({
                    status: newStatus,
                    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                });

                showSuccess(`Status updated to ${getStatusLabel(newStatus)}`);
            } catch (error) {
                console.error('Error updating status:', error);
                showError('Failed to update status: ' + error.message);
            }
        }

        // Utility functions
        function showError(message) {
            const container = document.querySelector('.container');
            if (!container) return;

            const errorDiv = document.createElement('div');
            errorDiv.className = 'error';
            errorDiv.textContent = message;
            container.prepend(errorDiv);
            setTimeout(() => errorDiv.remove(), 5000);
        }

        function showSuccess(message) {
            const container = document.querySelector('.container');
            if (!container) return;

            const successDiv = document.createElement('div');
            successDiv.className = 'success';
            successDiv.textContent = message;
            container.prepend(successDiv);
            setTimeout(() => successDiv.remove(), 3000);
        }
    </script>
</body>

</html>
